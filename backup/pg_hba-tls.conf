# Autenticação do PostgreSQL do SIGH (RNF-004): pela rede, só com TLS e senha (SCRAM). Conexão sem
# TLS é recusada, inclusive a de replicação, que leva o backup inteiro.
# TIPO     BANCO        USUÁRIO  ENDEREÇO  MÉTODO
local      all          all                scram-sha-256
hostssl    all          all      all       scram-sha-256
hostssl    replication  all      all       scram-sha-256
hostnossl  all          all      all       reject
hostnossl  replication  all      all       reject
