# HTTPS/TLS no próprio back-end (RNF-004): sem terminar o TLS num intermediário, o dado só é
# decifrado aqui. Certificado e chave privada em PEM vêm do ambiente, nunca do repositório.
server.ssl.bundle=sigh-tls
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.http2.enabled=true
spring.ssl.bundle.pem.sigh-tls.keystore.certificate=${SIGH_TLS_CERTIFICADO}
spring.ssl.bundle.pem.sigh-tls.keystore.private-key=${SIGH_TLS_CHAVE_PRIVADA}
# Conexão com o banco também cifrada: o DB_URL de produção deve terminar com ?sslmode=verify-full
# O serviço de IA recebe dado clínico: fora da própria máquina, só por HTTPS.
sigh.ia.exigir-https=true
