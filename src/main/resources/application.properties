spring.application.name=sigh-project

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sigh}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Dados pessoais fora dos logs (RNF-003): o driver não inclui os valores das colunas
# (ex.: "Key (cpf)=(...)") nas mensagens de erro, e o Hibernate não registra o erro SQL em WARN.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
logging.level.org.hibernate.orm.jdbc.error=ERROR

# Fuso usado para registrar data e horário (consentimento, atendimento).
sigh.fuso-horario=${SIGH_FUSO_HORARIO:America/Bahia}

sigh.jwt.segredo=${SIGH_JWT_SEGREDO}
sigh.jwt.validade=8h
sigh.jwt.validade-segundo-fator-pendente=5m
sigh.segundo-fator.emissor=SIGH

sigh.ia.url=${SIGH_IA_URL:http://localhost:11434}
sigh.ia.modelo=${SIGH_IA_MODELO:qwen3:8b}
sigh.ia.chave=${SIGH_IA_CHAVE:}
# Hosts de IA fora da própria máquina autorizados a receber dado clínico (separados por vírgula).
sigh.ia.hosts-autorizados=${SIGH_IA_HOSTS_AUTORIZADOS:}
sigh.ia.temperatura=0
sigh.ia.tempo-limite=30s
sigh.ia.limite-registros-historico=20

# Máximo de registros devolvidos na consulta comum do histórico pelo profissional.
sigh.historico.limite-registros=200
# BE-18: o acesso de emergência só vale até este prazo depois da classificação vermelha ou laranja.
sigh.emergencia.janela=12h
sigh.ia.instrucoes-triagem=classpath:ia/instrucoes-triagem.txt
sigh.ia.instrucoes-resumo=classpath:ia/instrucoes-resumo.txt

sigh.triagem.tempo-maximo-espera.vermelho=0m
sigh.triagem.tempo-maximo-espera.laranja=10m
sigh.triagem.tempo-maximo-espera.amarelo=60m
sigh.triagem.tempo-maximo-espera.verde=120m
sigh.triagem.tempo-maximo-espera.azul=240m

# Chave AES-256 dos dados clínicos em repouso (RNF-004), em Base64, sempre vinda do ambiente.
# Gere com: openssl rand -base64 32. Chaves antigas ficam só para leitura: id:chaveBase64,...
sigh.cripto.chave=${SIGH_CHAVE_DADOS}
sigh.cripto.chave-id=${SIGH_CHAVE_DADOS_ID:1}
sigh.cripto.chaves-anteriores=${SIGH_CHAVES_DADOS_ANTERIORES:}
