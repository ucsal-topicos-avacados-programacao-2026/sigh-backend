spring.application.name=sigh-project

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sigh}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

sigh.jwt.segredo=${SIGH_JWT_SEGREDO}
sigh.jwt.validade=8h
sigh.jwt.validade-segundo-fator-pendente=5m
sigh.segundo-fator.emissor=SIGH

sigh.ia.url=${SIGH_IA_URL:http://localhost:11434}
sigh.ia.modelo=${SIGH_IA_MODELO:qwen3:8b}
sigh.ia.chave=${SIGH_IA_CHAVE:}
sigh.ia.temperatura=0
sigh.ia.tempo-limite=30s
sigh.ia.limite-registros-historico=20
sigh.ia.instrucoes-triagem=classpath:ia/instrucoes-triagem.txt
sigh.ia.instrucoes-resumo=classpath:ia/instrucoes-resumo.txt

sigh.triagem.tempo-maximo-espera.VERMELHO=0m
sigh.triagem.tempo-maximo-espera.LARANJA=10m
sigh.triagem.tempo-maximo-espera.AMARELO=60m
sigh.triagem.tempo-maximo-espera.VERDE=120m
sigh.triagem.tempo-maximo-espera.AZUL=240m
